// La copia de Maven Central que mantiene Google va PRIMERO: Maven Central a veces
// limita las descargas (error 429) y la compilación en GitHub fallaba con
// "Could not find ...". Los demás depósitos quedan de respaldo.
pluginManagement {
    repositories {
        google()
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
    }
}
rootProject.name = "MotoIntercom"
include(":app")
