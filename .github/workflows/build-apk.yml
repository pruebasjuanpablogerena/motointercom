name: Compilar APK

# Se ejecuta solo cuando subes cambios a la rama main,
# o si lo lanzas manualmente desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Compilar el APK
        run: gradle assembleDebug

      - name: Publicar el APK en un release fijo ("latest")
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Última versión"
          body: "Se genera automáticamente en cada actualización del código."
          allowUpdates: true
          removeArtifacts: true
          artifacts: "app/build/outputs/apk/debug/app-debug.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
